services:
  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: sentinela-fluent-bit
    restart: always
    environment:
      NATS_HOST: ${NATS_HOST:-nats}
      NATS_PORT: ${NATS_PORT:-4222}
      RAW_LOGS_SUBJECT: ${RAW_LOGS_SUBJECT:-sentinela.logs.raw}
    volumes:
      - ./infra/fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infra/fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/log:/host/var/log:ro
      - /var/lib/docker/containers:/host/var/lib/docker/containers:ro
      - fluent-bit-state:/var/fluent-bit/state
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    healthcheck:
      test: ["CMD", "/fluent-bit/bin/fluent-bit", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    cpus: "0.20"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - sentinela-event-net

  websocket_gateway:
    build:
      context: ./services/websocket_gateway
    container_name: sentinela-websocket-gateway
    restart: always
    profiles: ["gateway"]
    environment:
      NATS_URL: nats://nats:4222
      ALERTS_SUBJECT: ${ALERTS_SUBJECT:-sentinela.alerts.detections}
      WEBSOCKET_PORT: 8765
      METRICS_PORT: 8013
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 96m
    cpus: "0.15"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - sentinela-event-net

  ingestion_worker:
    build:
      context: ./services/ingestion_worker
    container_name: sentinela-ingestion-worker
    restart: always
    profiles: ["fallback-tail"]
    environment:
      NATS_URL: nats://nats:4222
      RAW_LOGS_SUBJECT: ${RAW_LOGS_SUBJECT:-sentinela.logs.raw}
      INGESTION_LOG_PATHS: /host/var/log/auth.log,/host/var/log/syslog
      METRICS_PORT: 8010
    volumes:
      - /var/log:/host/var/log:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/metrics', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 96m
    cpus: "0.15"
    networks:
      - sentinela-event-net

  parser_engine:
    build:
      context: ./services/parser_engine
    container_name: sentinela-parser-engine
    restart: always
    environment:
      NATS_URL: nats://nats:4222
      RAW_LOGS_SUBJECT: ${RAW_LOGS_SUBJECT:-sentinela.logs.raw}
      NORMALIZED_EVENTS_SUBJECT: ${NORMALIZED_EVENTS_SUBJECT:-sentinela.events.normalized}
      DLQ_SUBJECT: ${DLQ_SUBJECT:-sentinela.events.dlq}
      METRICS_PORT: 8011
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    cpus: "0.20"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - sentinela-event-net

  detection_engine:
    build:
      context: ./services/detection_engine
    container_name: sentinela-detection-engine
    restart: always
    environment:
      NATS_URL: nats://nats:4222
      NORMALIZED_EVENTS_SUBJECT: ${NORMALIZED_EVENTS_SUBJECT:-sentinela.events.normalized}
      ALERTS_SUBJECT: ${ALERTS_SUBJECT:-sentinela.alerts.detections}
      DLQ_SUBJECT: ${DLQ_SUBJECT:-sentinela.events.dlq}
      DETECTION_RULES_DIR: /rules
      CORE_API_URL: ${CORE_API_URL:-http://sentinela-api-lite:5000}
      SENTINELA_API_TOKEN: ${SENTINELA_API_TOKEN:-sentinela-demo-token}
      METRICS_PORT: 8012
    volumes:
      - ./infra/detection_rules:/rules:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 160m
    cpus: "0.25"
    depends_on:
      parser_engine:
        condition: service_healthy
    networks:
      - sentinela-event-net
      - sentinela-core-net

volumes:
  fluent-bit-state:

networks:
  sentinela-event-net:
    external: true
    name: sentinela-event-net
  sentinela-core-net:
    external: true
    name: sentinela_sentinela-micro-net
