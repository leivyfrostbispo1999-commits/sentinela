services:
  # --- CORE PROFILE (Otimizado para Nuvem 24GB) ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sentinela-kafka
    profiles: ["core", "full"]
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168 # 7 dias na nuvem
      KAFKA_LOG_RETENTION_BYTES: 5368709120 # 5GB
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 10
    networks:
      - sentinela-net
    mem_limit: 2g
    cpus: "1.0"

  db:
    image: postgres:15
    container_name: sentinela-db
    profiles: ["core", "full"]
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - sentinela-db-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - sentinela-net
    mem_limit: 1g
    cpus: "0.50"

  redis:
    image: redis:7-alpine
    container_name: sentinela-redis
    profiles: ["core", "full"]
    restart: always
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - sentinela-net
    mem_limit: 1g

  # --- SERVIÇOS SENTINELA ---
  log_collector:
    build: ./services/log_collector
    container_name: sentinela-log-collector
    profiles: ["core", "full"]
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_LOGS_TOPIC: raw_logs
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - sentinela-net
    mem_limit: 512m

  rule_engine:
    build: ./services/rule_engine
    container_name: sentinela-rule-engine
    profiles: ["core", "full"]
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_LOGS_TOPIC: enriched_events
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinela-net
    mem_limit: 1g

  dashboard_api:
    build: ./services/dashboard_api
    container_name: sentinela-dashboard-api
    profiles: ["core", "full"]
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      SENTINELA_ENV: production
    networks:
      - sentinela-net
    mem_limit: 512m

  dashboard_web:
    build: ./services/dashboard_web
    container_name: sentinela-dashboard-web
    profiles: ["core", "full"]
    restart: always
    ports:
      - "80:80"
    networks:
      - sentinela-net

  # --- OBSERVABILITY ---
  grafana:
    image: grafana/grafana:10.4.3
    container_name: sentinela-grafana
    profiles: ["core", "full"]
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - sentinela-grafana-data:/var/lib/grafana
    networks:
      - sentinela-net
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sentinela-prometheus
    profiles: ["core", "full"]
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sentinela-prometheus-data:/prometheus
    networks:
      - sentinela-net

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: sentinela-jaeger
    profiles: ["core", "full"]
    restart: always
    ports:
      - "16686:16686"
    networks:
      - sentinela-net

  # --- GRAPH ENGINE ---
  neo4j:
    image: neo4j:5.19-community
    container_name: sentinela-neo4j
    profiles: ["graph", "full"]
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sentinela-graph
    volumes:
      - sentinela-neo4j-data:/data
    networks:
      - sentinela-net
    mem_limit: 4g
    cpus: "1.0"

networks:
  sentinela-net:
    driver: bridge

volumes:
  sentinela-db-data:
  sentinela-prometheus-data:
  sentinela-grafana-data:
  sentinela-neo4j-data:
