limit_req_zone $binary_remote_addr zone=web_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        default_type application/json;
        try_files /health =200;
    }

    location = /runtime/host_metrics.json {
        default_type application/json;
        try_files /runtime/host_metrics.json =404;
    }

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    location /ws/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://dashboard_api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://dashboard_api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|ready|alertas|alerts|demo|incidents|investigation|reports|rules|metrics|auth|response|audit|search|graph|copilot|billing|tenants|plans|hunting|ioc|correlation|replay|retention)(/|$) {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://dashboard_api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=web_limit burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
