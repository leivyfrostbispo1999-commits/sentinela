rules:
  - title: "Port Scanning Detected"
    description: "Detecta varredura de portas contra ativos do laboratório."
    enabled: true
    logsource:
      product: "sentinela-xdr"
    detection:
      selection:
        event_type: "PORT_SCAN"
      condition: "selection"
    level: "LOW"
    priority: 20
    tags:
      - "attack.t1046"

  - title: "Brute Force Attack"
    description: "Detecta múltiplas tentativas de autenticação falhas."
    enabled: true
    detection:
      selection:
        event_type: "BRUTE_FORCE"
      condition: "selection"
    level: "HIGH"
    priority: 45
    tags:
      - "attack.t1110"

  - title: "Suspicious API Call via Regex"
    description: "Detecta chamadas de API perigosas usando modificadores de regex."
    enabled: true
    detection:
      selection:
        api_call|re: "^(DeleteLogGroup|CreateUser|DisableLogging)$"
      condition: "selection"
    level: "MEDIUM"
    priority: 35
    tags:
      - "attack.t1071"

  - title: "Multi-Stage Attack (Sigma Style)"
    description: "Detecta a progressão de um ataque combinando múltiplas seleções."
    enabled: true
    detection:
      selection_recon:
        event_type: "PORT_SCAN"
      selection_access:
        event_type: ["BRUTE_FORCE", "FAILED_LOGIN"]
      condition: "selection_recon and selection_access"
    level: "HIGH"
    priority: 80
    tags:
      - "attack.progression"

  - title: "Critical IOC Domain"
    description: "Detecta tráfego para domínios maliciosos conhecidos via sufixo."
    enabled: true
    detection:
      selection:
        target_host|endswith: ".onion"
      condition: "selection"
    level: "CRITICAL"
    priority: 95
    tags:
      - "attack.t1071"
