rules:
  - title: "Ataque Multietapa Detectado"
    description: "Detecta progressão de Port Scan para Brute Force"
    enabled: true
    level: "high"
    tags:
      - "attack.t1046"
      - "attack.t1110"
    detection:
      selection:
        event_type: ["PORT_SCAN", "BRUTE_FORCE"]
      condition: "selection"
    threshold:
      count: 2
      timeframe: "300s"
    action: "simulated_block"

  - title: "Campanha Hostil de Alta Frequência"
    description: "Muitos eventos do mesmo IP em curto intervalo"
    enabled: true
    level: "high"
    tags:
      - "attack.discovery"
    detection:
      selection:
        event_type: ["ANY"] # ANY é tratado no match_selection se necessário, ou deixamos em branco para pegar tudo
      condition: "selection"
    threshold:
      count: 7
      timeframe: "300s"
    action: "simulated_block"

  - title: "Brute Force em Porta Sensível"
    description: "Falhas de login em portas administrativas (22, 3389)"
    enabled: true
    level: "critical"
    tags:
      - "attack.t1110"
    logsource:
      port: [22, 3389]
    detection:
      selection:
        event_type: ["BRUTE_FORCE", "FAILED_LOGIN", "SSH_FAILED"]
      condition: "selection"
    threshold:
      count: 3
      timeframe: "300s"
    action: "simulated_block"

  - title: "Distributed SSH Brute Force (Sigma-like)"
    description: "Múltiplos IPs tentando brute force contra o mesmo usuário"
    enabled: true
    level: "critical"
    tags:
      - "attack.credential_access"
      - "attack.t1110"
    logsource:
      service: "ssh"
    detection:
      selection:
        event_type: "FAILED_LOGIN"
      condition: "selection"
    threshold:
      count: 5
      timeframe: "300s"
    action: "simulated_block"
