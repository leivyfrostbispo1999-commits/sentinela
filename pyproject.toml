[tool.black]
line-length = 140
target-version = ["py311"]

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = [
  ".git",
  ".pytest_cache",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = false
exclude = [
  "tests/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "asyncio: mark a test as asyncio-based",
]
