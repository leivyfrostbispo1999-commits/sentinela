services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 12
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka-data:/var/lib/kafka/data

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data

  log_collector:
    build: ../../services/log_collector
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_LOGS_TOPIC: ${RAW_LOGS_TOPIC:-raw_logs}
      METRICS_PORT: 8000

  rule_engine:
    build: ../../services/rule_engine
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_LOGS_TOPIC: ${RAW_LOGS_TOPIC:-raw_logs}
      ALERTS_TOPIC: ${ALERTS_TOPIC:-security_alerts}
      REDIS_URL: redis://redis:6379/0
      REDIS_STATE_ENABLED: "true"
      ENABLE_BLOCK: "false"
      METRICS_PORT: 8000
    deploy:
      replicas: ${RULE_ENGINE_REPLICAS:-1}

  alert_sink:
    build: ../../services/alert-sink
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ALERTS_TOPIC: ${ALERTS_TOPIC:-security_alerts}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      METRICS_PORT: 8000

  dashboard_api:
    build: ../../services/dashboard_api
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SENTINELA_API_TOKEN: ${SENTINELA_API_TOKEN}
      SENTINELA_JWT_SECRET: ${SENTINELA_JWT_SECRET}
      ENABLE_AUTH: ${ENABLE_AUTH:-true}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}

  dashboard_web:
    build: ../../services/dashboard_web
    restart: always
    ports:
      - "${DASHBOARD_PORT:-8080}:80"

  dashboard_web_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    restart: always
    command:
      - "--nginx.scrape-uri=http://dashboard_web/stub_status"
    depends_on:
      - dashboard_web

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: always
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:10.4.3
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  kafka-data:
  db-data:
  redis-data:
  prometheus-data:
  grafana-data:

