apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinela-api
spec:
  template:
    spec:
      containers:
        - name: dashboard-api
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinela-web
spec:
  template:
    spec:
      containers:
        - name: dashboard-web
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinela-log-collector
spec:
