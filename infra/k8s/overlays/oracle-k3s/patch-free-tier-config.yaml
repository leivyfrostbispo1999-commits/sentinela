apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinela-config
data:
  QUEUE_BACKEND: nats
  NATS_URL: nats://sentinela-nats:4222
  KAFKA_BOOTSTRAP_SERVERS: ""
  REDIS_URL: redis://sentinela-redis:6379/0
  ENABLE_TRACING: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  ENABLE_AUTH: "true"
  ENABLE_RATE_LIMITING: "true"
  CORS_ALLOWED_ORIGINS: https://sentinela.example.com
  PIPELINE_MAX_BATCH_SIZE: "25"
  PIPELINE_CONSUMER_TIMEOUT_MS: "1000"
  PIPELINE_POLL_INTERVAL_MS: "500"
