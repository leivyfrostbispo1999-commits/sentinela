apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinela-log-collector
  labels:
    app.kubernetes.io/name: log-collector
    app.kubernetes.io/part-of: sentinela
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: log-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-collector
        app.kubernetes.io/part-of: sentinela
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: sentinela-worker
      containers:
        - name: log-collector
          image: sentinela/log-collector:latest
          ports:
            - name: metrics
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sentinela-config
          env:
            - name: METRICS_PORT
              value: "8000"
            - name: OTEL_SERVICE_NAME
              value: sentinela-log-collector
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
