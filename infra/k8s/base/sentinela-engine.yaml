apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinela-rule-engine
  namespace: sentinela
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinela-rule-engine
  template:
    metadata:
      labels:
        app: sentinela-rule-engine
    spec:
      containers:
      - name: engine
        image: sentinela/rule-engine:latest
        envFrom:
        - configMapRef:
            name: sentinela-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sentinela-rule-engine
  namespace: sentinela
spec:
  ports:
  - port: 8080
  selector:
    app: sentinela-rule-engine
