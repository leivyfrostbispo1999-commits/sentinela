apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinela-api
  labels:
    app.kubernetes.io/name: sentinela
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinela-worker
  labels:
    app.kubernetes.io/name: sentinela
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinela-observability
  labels:
    app.kubernetes.io/name: sentinela
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinela-read-only
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinela-observability-read-only
subjects:
  - kind: ServiceAccount
    name: sentinela-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinela-read-only
