apiVersion: v1
kind: Service
metadata:
  name: sentinela-web
  labels:
    app.kubernetes.io/name: dashboard-web
    app.kubernetes.io/part-of: sentinela
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: dashboard-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinela-web
  labels:
    app.kubernetes.io/name: dashboard-web
    app.kubernetes.io/part-of: sentinela
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard-web
        app.kubernetes.io/part-of: sentinela
    spec:
      serviceAccountName: sentinela-api
      containers:
        - name: dashboard-web
          image: sentinela/dashboard-web:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
