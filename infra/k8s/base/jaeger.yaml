apiVersion: v1
kind: Service
metadata:
  name: sentinela-jaeger-collector
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: sentinela
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
  selector:
    app.kubernetes.io/name: jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinela-jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: sentinela
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: sentinela
    spec:
      serviceAccountName: sentinela-observability
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.55
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
