apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinela-config
  labels:
    app.kubernetes.io/name: sentinela
data:
  DB_HOST: sentinela-postgres
  DB_PORT: "5432"
  DB_NAME: postgres
  DB_USER: postgres
  KAFKA_BOOTSTRAP_SERVERS: sentinela-kafka:9092
  REDIS_URL: redis://sentinela-redis:6379/0
  RAW_LOGS_TOPIC: raw_logs
  ENRICHED_EVENTS_TOPIC: enriched_events
  DETECTIONS_TOPIC: detections
  ALERTS_TOPIC: alerts
  AUDIT_LOGS_TOPIC: audit_logs
  DLQ_TOPIC: dead_letter_events
  DEFAULT_TENANT_ID: default
  SENTINELA_ENV: production
  ENABLE_AUTH: "true"
  ENABLE_RATE_LIMITING: "true"
  RATE_LIMIT_PER_MINUTE: "240"
  RATE_LIMIT_AUTH_PER_MINUTE: "20"
  RATE_LIMIT_API_PER_MINUTE: "120"
  ENABLE_TRACING: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://sentinela-jaeger-collector:4317
  CORS_ALLOWED_ORIGINS: https://sentinela.example.com
