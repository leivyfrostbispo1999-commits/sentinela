name: sentinela-7-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest bandit
          for f in services/*/requirements.txt; do python -m pip install -r "$f"; done

      - name: Security Scan (Bandit)
        run: bandit -r services/ scripts/ -x tests/ -ll

      - name: Security Scan (Trivy FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Run unit tests
        env:
          SENTINELA_JWT_SECRET: ci-test-secret
          ENABLE_AUTH: "true"
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Validate Docker Compose configs
        run: |
          docker compose config
          docker compose --profile search config
          docker compose --profile production config

      - name: Validate frontend artifact
        run: test -f services/dashboard_web/index.html
