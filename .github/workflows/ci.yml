name: sentinela-7-ci

on:
  push:
  pull_request:

jobs:
  test-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          for f in services/*/requirements.txt; do python -m pip install -r "$f"; done

      - name: Run unit tests
        env:
          SENTINELA_JWT_SECRET: ci-test-secret
          ENABLE_AUTH: "true"
        run: python -m pytest -q

      - name: Compile Python services and scripts
        run: |
          python -m py_compile services/dashboard_api/main.py services/alert-sink/main.py services/rule_engine/main.py services/log_collector/main.py services/simulator/main.py
          python -m py_compile scripts/replay_attack.py scripts/replay_events.py scripts/retention_cleanup.py scripts/generate_password_hash.py

      - name: Validate Docker Compose configs
        run: |
          docker compose config
          docker compose --profile search config
          docker compose --profile production config

      - name: Validate frontend artifact
        run: test -f services/dashboard_web/index.html
