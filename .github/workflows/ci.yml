name: sentinela-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest bandit pyyaml
          for f in services/*/requirements.txt; do python -m pip install -r "$f"; done

      - name: Security Scan (Bandit)
        run: bandit -r services/ scripts/ -x tests/ -ll

      - name: Security Scan (Trivy FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Run unit tests
        env:
          SENTINELA_JWT_SECRET: ci-test-secret
          ENABLE_AUTH: "true"
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Validate Docker Compose configs
        run: |
          docker compose config
          docker compose --profile search config
          docker compose --profile production config

      - name: Validate Kubernetes YAML parse
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path("infra/k8s").rglob("*.yaml"):
              docs = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              assert any(doc for doc in docs), f"{path} has no YAML documents"
          PY

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Validate Kubernetes kustomize overlays
        run: |
          kubectl kustomize infra/k8s/base >/tmp/sentinela-base.yaml
          kubectl kustomize infra/k8s/overlays/dev >/tmp/sentinela-dev.yaml
          kubectl kustomize infra/k8s/overlays/prod >/tmp/sentinela-prod.yaml
          kubectl kustomize infra/k8s/overlays/oracle-k3s >/tmp/sentinela-oracle-k3s.yaml
          kubectl kustomize infra/k8s/overlays/mtls-linkerd >/tmp/sentinela-mtls.yaml
          test -s /tmp/sentinela-base.yaml
          test -s /tmp/sentinela-dev.yaml
          test -s /tmp/sentinela-prod.yaml
          test -s /tmp/sentinela-oracle-k3s.yaml
          test -s /tmp/sentinela-mtls.yaml

      - name: Validate frontend artifact
        run: test -f services/dashboard_web/index.html
