services:
  # --- CORE PROFILE ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sentinela-kafka
    profiles: ["core", "full"]
    restart: unless-stopped
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s
    networks:
      - sentinela-net
    mem_limit: 1g
    cpus: "1.0"

  db:
    image: postgres:15
    container_name: sentinela-db
    profiles: ["core", "full"]
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - sentinela-db-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - sentinela-net
    mem_limit: 512m
    cpus: "0.50"

  redis:
    image: redis:7-alpine
    container_name: sentinela-redis
    profiles: ["core", "full"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
    networks:
      - sentinela-net
    mem_limit: 128m
    cpus: "0.20"

  log_collector:
    build: ./services/log_collector
    container_name: sentinela-log-collector
    profiles: ["core", "full"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      RAW_LOGS_TOPIC: ${RAW_LOGS_TOPIC:-raw_logs}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      METRICS_PORT: 8000
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; os.environ['NO_PROXY']='127.0.0.1'; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - sentinela-net
    mem_limit: 256m
    cpus: "0.25"

  rule_engine:
    build: ./services/rule_engine
    container_name: sentinela-rule-engine
    profiles: ["core", "full"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      RAW_LOGS_TOPIC: ${RAW_LOGS_TOPIC:-enriched_logs}
      ALERTS_TOPIC: ${ALERTS_TOPIC:-security_alerts}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      METRICS_PORT: 8001
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; os.environ['NO_PROXY']='127.0.0.1'; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - sentinela-net
    mem_limit: 512m
    cpus: "0.75"

  alert_sink:
    build: ./services/alert-sink
    container_name: sentinela-alert-sink
    profiles: ["core", "full"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ALERTS_TOPIC: ${ALERTS_TOPIC:-security_alerts}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      ENABLE_OPENSEARCH: ${ENABLE_OPENSEARCH:-false}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX_ALERTS: ${OPENSEARCH_INDEX_ALERTS:-sentinela-alerts}
      DLQ_TOPIC: ${DLQ_TOPIC:-dead_letter_events}
      PIPELINE_MAX_RETRIES: ${PIPELINE_MAX_RETRIES:-3}
      PIPELINE_RETRY_BACKOFF_MS: ${PIPELINE_RETRY_BACKOFF_MS:-500}
      PIPELINE_MAX_BATCH_SIZE: ${PIPELINE_MAX_BATCH_SIZE:-100}
      PIPELINE_CONSUMER_TIMEOUT_MS: ${PIPELINE_CONSUMER_TIMEOUT_MS:-1000}
      PIPELINE_POLL_INTERVAL_MS: ${PIPELINE_POLL_INTERVAL_MS:-250}
      METRICS_PORT: 8000
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; os.environ['NO_PROXY']='127.0.0.1'; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - sentinela-net
    mem_limit: 256m
    cpus: "0.35"

  dashboard_api:
    build: ./services/dashboard_api
    container_name: sentinela-dashboard-api
    profiles: ["core", "full"]
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SENTINELA_API_TOKEN: ${SENTINELA_API_TOKEN:-sentinela-demo-token}
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      SENTINELA_JWT_SECRET: ${SENTINELA_JWT_SECRET:-sentinela-demo-jwt-secret}
      SENTINELA_JWT_SECRET_FILE: ${SENTINELA_JWT_SECRET_FILE:-}
      SENTINELA_JWT_TTL_SECONDS: ${SENTINELA_JWT_TTL_SECONDS:-3600}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      SENTINELA_ENV: ${SENTINELA_ENV:-development}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      SENTINELA_USERS_JSON: ${SENTINELA_USERS_JSON:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      ENABLE_RATE_LIMITING: ${ENABLE_RATE_LIMITING:-false}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
      ENABLE_TRACING: ${ENABLE_TRACING:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sentinela-7-api}
      ENABLE_OPENSEARCH: ${ENABLE_OPENSEARCH:-false}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX_ALERTS: ${OPENSEARCH_INDEX_ALERTS:-sentinela-alerts}
    volumes:
      - ./infra:/app/infra
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; os.environ['NO_PROXY']='127.0.0.1'; urllib.request.urlopen('http://127.0.0.1:5000/ready', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - sentinela-net
    mem_limit: 256m
    cpus: "0.35"

  dashboard_web:
    build: ./services/dashboard_web
    container_name: sentinela-dashboard-web
    profiles: ["core", "full"]
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      dashboard_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
    networks:
      - sentinela-net
    mem_limit: 128m
    cpus: "0.20"

  enrichment-worker:
    build: ./services/enrichment_worker
    container_name: sentinela-enrichment
    profiles: ["core", "full"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      RAW_LOGS_TOPIC: ${RAW_LOGS_TOPIC:-raw_logs}
      ENRICHED_LOGS_TOPIC: ${ENRICHED_LOGS_TOPIC:-enriched_logs}
      METRICS_PORT: 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; os.environ['NO_PROXY']='127.0.0.1'; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - sentinela-net
    mem_limit: 384m
    cpus: "0.50"

  simulator:
    build: ./services/simulator
    container_name: sentinela-simulator
    profiles: ["core", "full"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      RAW_LOGS_TOPIC: ${RAW_LOGS_TOPIC:-raw_logs}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      METRICS_PORT: 8000
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; os.environ['NO_PROXY']='127.0.0.1'; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - sentinela-net
    mem_limit: 256m
    cpus: "0.25"

  # --- ANALYTICS PROFILE ---
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12
    container_name: sentinela-flink-jobmanager
    profiles: ["analytics", "full"]
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    networks:
      - sentinela-net
    mem_limit: 512m
    cpus: "0.50"

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12
    container_name: sentinela-flink-taskmanager
    profiles: ["analytics", "full"]
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - sentinela-net
    mem_limit: 1g
    cpus: "1.0"

  flink-correlation-job:
    build: ./services/flink_jobs
    container_name: sentinela-flink-job
    profiles: ["analytics", "full"]
    restart: unless-stopped
    depends_on:
      - kafka
      - flink-jobmanager
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - sentinela-net

  ai-engine:
    build: ./services/ai_engine
    container_name: sentinela-ai-engine
    profiles: ["analytics", "full"]
    restart: unless-stopped
    depends_on:
      - kafka
      - enrichment-worker
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - sentinela-net

  ueba-engine:
    build: ./services/ueba_engine
    container_name: sentinela-ueba
    profiles: ["analytics", "full"]
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - UEBA_VOLUME_THRESHOLD=40
    networks:
      - sentinela-net

  # --- GRAPH PROFILE ---
  neo4j:
    image: neo4j:5.19-community
    container_name: sentinela-neo4j
    profiles: ["graph", "full"]
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sentinela-graph
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - sentinela-neo4j-data:/data
    networks:
      - sentinela-net
    mem_limit: 1g
    cpus: "0.75"

  graph-engine:
    build: ./services/graph_engine
    container_name: sentinela-graph-engine
    profiles: ["graph", "full"]
    restart: unless-stopped
    depends_on:
      - kafka
      - neo4j
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=sentinela-graph
    networks:
      - sentinela-net

  # --- SEARCH PROFILE (COLD STORAGE) ---
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: sentinela-opensearch
    profiles: ["search", "full"]
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - sentinela-opensearch-data:/usr/share/opensearch/data
    networks:
      - sentinela-net
    mem_limit: 1g
    cpus: "0.75"

  # --- AUXILIARY / INFRA ---
  lifecycle-worker:
    build: ./services/lifecycle_worker
    container_name: sentinela-lifecycle
    profiles: ["core", "full"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RETENTION_ALERTS_DAYS: ${RETENTION_ALERTS_DAYS:-7}
    networks:
      - sentinela-net
    mem_limit: 384m
    cpus: "0.50"

  # --- OBSERVABILITY ---
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: sentinela-jaeger
    profiles: ["core", "full"]
    restart: unless-stopped
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - sentinela-net
    mem_limit: 512m
    cpus: "0.50"

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sentinela-prometheus
    profiles: ["core", "full"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sentinela-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      dashboard_api:
        condition: service_healthy
    networks:
      - sentinela-net
    mem_limit: 256m
    cpus: "0.25"

  grafana:
    image: grafana/grafana:10.4.3
    container_name: sentinela-grafana
    profiles: ["core", "full"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-sentinela}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - sentinela-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - sentinela-net
    mem_limit: 384m
    cpus: "0.35"

networks:
  sentinela-net:
    driver: bridge

volumes:
  sentinela-db-data:
  sentinela-prometheus-data:
  sentinela-grafana-data:
  sentinela-opensearch-data:
  sentinela-neo4j-data:
