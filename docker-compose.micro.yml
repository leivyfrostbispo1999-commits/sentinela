services:
  db:
    image: postgres:15-alpine
    container_name: sentinela-db-lite
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - sentinela-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 160m
    cpus: "0.30"
    networks:
      - sentinela-micro-net

  redis:
    image: redis:7-alpine
    container_name: sentinela-redis-lite
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 96m
    cpus: "0.15"
    networks:
      - sentinela-micro-net

  dashboard_api:
    build:
      context: ./services/dashboard_api
    container_name: sentinela-api-lite
    restart: always
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_HOST: db
      SENTINELA_ENV: production
      SENTINELA_JWT_SECRET: ${SENTINELA_JWT_SECRET}
      ENABLE_AUTH: "true"
      ENABLE_RATE_LIMITING: "true"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 220m
    cpus: "0.40"
    networks:
      - sentinela-micro-net

  dashboard_web:
    build:
      context: ./services/dashboard_web
    container_name: sentinela-web-lite
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    volumes:
      - ./ops/oci/runtime:/usr/share/nginx/html/runtime:ro
    depends_on:
      dashboard_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    cpus: "0.15"
    networks:
      - sentinela-micro-net

networks:
  sentinela-micro-net:
    driver: bridge

volumes:
  sentinela-db-data:
