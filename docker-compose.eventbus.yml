services:
  nats:
    image: nats:2.10-alpine
    container_name: sentinela-eventbus-nats
    restart: always
    command:
      - --jetstream
      - --store_dir=/data/jetstream
      - --http_port=8222
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - sentinela-eventbus-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 384m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sentinela-event-net

volumes:
  sentinela-eventbus-nats-data:

networks:
  sentinela-event-net:
    external: true
    name: sentinela-event-net
